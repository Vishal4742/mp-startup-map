# Publishes the static build (map + search + filters; no Add/Verify) to GitHub Pages.
# Manual trigger only: enable Pages first (Settings → Pages → Source: GitHub Actions;
# on a free plan the repository must be public), then run this workflow.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p site/data site/shared
          cp index.html app.js style.css site/
          cp shared/normalize.js site/shared/
          cp data/tech_registry.json data/enriched.json data/district_coords.json site/data/
          [ -f data/registry_meta.json ] && cp data/registry_meta.json site/data/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
