name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Backend tests
        run: npm test
      - name: Syntax + frontend contract check
        run: npm run check
      - name: Coordinate generator matches the committed JSON
        run: python3 data/district_coords.py | diff - data/district_coords.json
